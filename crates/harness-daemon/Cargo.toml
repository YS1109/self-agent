[package]
name = "harness-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
async-stream.workspace = true
axum.workspace = true
cap-fs-ext.workspace = true
cap-std.workspace = true
chrono.workspace = true
dirs.workspace = true
futures-util.workspace = true
flate2.workspace = true
sha1.workspace = true
libc.workspace = true
fs2 = "0.4"
harness-core = { path = "../harness-core" }
reqwest.workspace = true
ring = "=0.17.14"
semver = "=1.0.28"
url = "=2.5.8"
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shlex.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing.workspace = true
tracing-subscriber.workspace = true
toml = "0.9"

keyring-core = "=1.0.1"
zeroize = "1"
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", default-features = false, features = ["rt-tokio-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", default-features = false, features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_SystemServices", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

[[example]]
name = "update_fixture"
path = "../../scripts/update_fixture.rs"
