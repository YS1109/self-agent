name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Rust and protocol / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p harness-core -p harness-daemon -p harness-cli -p harness-gateway --all-targets -- -D warnings
      - run: cargo test -p harness-core -p harness-daemon -p harness-cli -p harness-gateway
      - run: cargo build -p harness-daemon -p harness-cli -p harness-gateway
      - run: python scripts/smoke.py
      - run: python scripts/provider_smoke.py
      - run: python scripts/configuration_smoke.py
      - run: python scripts/orchestration_smoke.py
      - run: python scripts/agents_smoke.py
      - run: python scripts/runtime_smoke.py
      - run: python scripts/plan_change_smoke.py
      - run: python scripts/headless_smoke.py
      - run: python scripts/streaming_smoke.py
      - run: python scripts/continuation_smoke.py
      - run: python scripts/steering_smoke.py
      - run: python scripts/changes_smoke.py
      - run: python scripts/budget_smoke.py
      - run: python scripts/execution_control_smoke.py
      - run: python scripts/capabilities_smoke.py
      - run: python scripts/qq_smoke.py
      - run: python scripts/gateway_smoke.py
      - run: python scripts/reliability_smoke.py
      - run: python scripts/history_smoke.py
      - run: python scripts/history_benchmark.py --self-test
      - run: cargo build -p harness-daemon --example update_fixture
      - run: python scripts/update_control_smoke.py
      - run: python scripts/package_lifecycle_smoke.py --self-test
      - run: python scripts/package_lifecycle_smoke.py

  desktop:
    name: Desktop / ${{ matrix.os }}
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build:web
      - run: pnpm build:mobile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/web_stream_smoke.py
      - run: node scripts/prepare-sidecar.mjs
      - run: cargo check -p self-agent-desktop
      - run: cargo test -p self-agent-desktop --lib
